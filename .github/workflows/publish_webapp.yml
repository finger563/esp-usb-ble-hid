name: Publish Dongle Console (GitHub Pages)

# Publishes web/ (the browser dongle console) to GitHub Pages so it is reachable
# at https://finger563.github.io/esp-usb-ble-hid/dongle_console.html -- the URL
# the firmware advertises as its WebUSB landing page.
#
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/publish_webapp.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
