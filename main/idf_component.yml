## IDF Component Manager Manifest File
dependencies:
  espressif/esp_tinyusb: '>=2.0'
  idf: '>=5.4'
  espp/logger: '>=1.4.1'
  espp/format: '>=1.4.1'
  espp/color: '>=1.4.1'
  espp/math: '>=1.4.1'
  espp/task: '>=1.4.1'
  espp/timer: '>=1.4.1'
  espp/hid-rp: '>=1.4.1'
  espp/hid_service: '>=1.4.1'
  espp/qtpy: '>=1.4.1'
  espp/t-dongle-s3: '>=1.4.1'
  espp/ble_gatt_server: '>=1.4.1'
  # USB device side: the Switch Pro protocol engine + the composite USB device
  espp/switch_pro: '>=1.4.1'
  espp/usb_device: '>=1.4.1'
  # vendor-interface services: framing/routing, OTA, crash dumps, settings storage
  espp/stream_frame: '>=1.4.1'
  espp/dispatcher: '>=1.4.1'
  espp/ota: '>=1.4.1'
  espp/coredump: '>=1.4.1'
  # device identity / reboot (incl. into the ROM bootloader) and heap / task monitor
  espp/system: '>=1.4.1'
  espp/monitor: '>=1.4.1'
  # >=1.3.10: NvsHandle::get(std::string) no longer returns NVS's zero terminator as
  # part of the value (esp-cpp/espp#854), which made the stored BLE name fail
  # validation at boot and reset every setting to its default
  espp/nvs: '>=1.4.1'
